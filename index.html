<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#79cc52">
<title>เดือนชนเดือน · ไลฟ์ซิมเอาตัวรอดวัยทำงาน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;800&family=Mali:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#2b2036;--paper:#fff8e7;--paper2:#fff1c9;--accent:#ff6b5a;--accent2:#2ec4b6;--sun:#ffd23f;--sky:#8fd3ff;--mute:#7a6a85;--bad:#e5484d;--good:#2fa66a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#79cc52;color:var(--ink);font-family:'Sarabun','Noto Sans Thai',system-ui,sans-serif;font-size:16px;touch-action:manipulation;overscroll-behavior:none}
#world{position:fixed;left:50%;top:0;transform:translateX(-50%);z-index:1}
#lbls{position:fixed;left:50%;top:0;height:100%;transform:translateX(-50%);pointer-events:none;overflow:hidden;z-index:2}
#dim{position:fixed;inset:0;background:#2b2036;opacity:0;pointer-events:none;transition:opacity .3s;z-index:3}
body.s-setup #dim,body.s-online #dim,body.s-lobby #dim,body.s-over #dim{opacity:.55}
body.s-menu #dim{opacity:.18}
#app{position:fixed;left:50%;top:0;transform:translateX(-50%);width:100%;max-width:520px;height:100%;z-index:5}
#app.hud{pointer-events:none;display:flex;flex-direction:column}
#app.hud>*{pointer-events:auto}
#app.hud>.spacer{flex:1;pointer-events:none}
#app.page{overflow-y:auto;padding:14px 12px calc(24px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
h1{margin:0;font-family:'Mali','Sarabun',sans-serif;font-size:38px;font-weight:700;color:#fff;text-shadow:3px 3px 0 var(--ink),-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink)}
h2{margin:0 0 8px;font-family:'Mali','Sarabun',sans-serif;font-size:20px}
.card{background:var(--paper);border:3px solid var(--ink);border-radius:10px;padding:12px;margin-bottom:10px;box-shadow:0 4px 0 var(--ink)}
.btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;text-align:center;line-height:1.25;width:100%;min-height:54px;border:3px solid var(--ink);border-radius:10px;background:var(--accent);color:#fff;font:inherit;font-weight:800;font-size:17px;padding:8px 14px;box-shadow:0 5px 0 var(--ink);cursor:pointer;text-shadow:1px 1px 0 rgba(0,0,0,.25)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.alt{background:var(--accent2)}
.btn.sun{background:var(--sun);color:var(--ink);text-shadow:none}
.btn.ghost{background:var(--paper);color:var(--ink);text-shadow:none}
.btn.sm{min-height:42px;font-size:15px;border-radius:9px;box-shadow:0 4px 0 var(--ink)}
.btn small{display:block;font-weight:600;font-size:12px;opacity:.95}
.btn[disabled]{opacity:.45;pointer-events:none}
.stack>*+*{margin-top:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.title{text-align:center;padding:20px 6px 12px}
.title .logo{font-size:56px;filter:drop-shadow(0 3px 0 rgba(43,32,54,.5))}
.title p{color:#fff;margin:8px 0 0;font-weight:800;text-shadow:2px 2px 0 var(--ink)}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1}
input,select{font:inherit;border:3px solid var(--ink);border-radius:9px;padding:9px 12px;background:#fff;color:var(--ink);width:100%;min-height:46px}
.sub-title{font-weight:800;margin:2px 0 8px}
.muted{color:var(--mute);font-size:14px}
.tag{display:inline-block;font-size:12px;background:#ffe9a8;border:2px solid var(--ink);border-radius:8px;padding:0 6px;color:var(--ink);font-weight:600}
.neg{color:var(--bad)}
.code{font-size:44px;font-weight:800;letter-spacing:8px;text-align:center;background:#fff;border:3px dashed var(--ink);border-radius:10px;padding:6px}
.rank{display:flex;align-items:center;gap:10px}
.rank .n{font-size:26px;font-weight:800;width:34px;text-align:center}
.bd{font-size:12px;color:var(--mute);line-height:1.5}
.money{font-size:24px;font-weight:800}
/* ---- HUD ---- */
.top{background:linear-gradient(#fff8e7f2,#fff8e7dd);border-bottom:3px solid var(--ink);padding:6px 8px 6px}
.r1{display:flex;gap:4px;align-items:center}
.pill{background:#fff;border:2px solid var(--ink);border-radius:999px;padding:1px 9px;font-size:13px;font-weight:800;white-space:nowrap}
.pill.money{background:var(--sun);font-size:14px}
.pill.warn{background:#ffd9cf;border-color:var(--bad);color:#a3200f}
.ib{border:2px solid var(--ink);background:#fff;border-radius:9px;min-width:30px;height:30px;font:inherit;font-weight:800;font-size:14px;padding:0 4px;cursor:pointer;box-shadow:0 2px 0 var(--ink)}
.ib:active{transform:translateY(2px);box-shadow:none}
.ib.end{background:#e3f8f5}
.tbar{height:7px;border:2px solid var(--ink);border-radius:6px;background:#fff;margin:5px 0 4px;overflow:hidden}
.tbar i{display:block;height:100%;background:#4aa8e0}
.r2{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.gm{display:flex;align-items:center;gap:3px;font-size:12px;font-weight:800}
.gb{flex:1;height:9px;border:2px solid var(--ink);border-radius:5px;background:#fff;overflow:hidden}
.gb i{display:block;height:100%}
.r3{display:flex;gap:5px;margin-top:5px;overflow-x:auto}
.pl{flex:0 0 auto;display:flex;align-items:center;gap:3px;border:2px solid var(--ink);border-radius:8px;background:#fff;padding:0 6px;font-size:12px;font-weight:800;border-left-width:6px}
.pl.cur{background:#ffe9a8}
.dock{background:linear-gradient(#fff8e7ee,#fff8e7);border-top:3px solid var(--ink);padding:6px 8px calc(8px + env(safe-area-inset-bottom))}
.dh{display:flex;align-items:center;gap:6px;margin-bottom:6px;font-size:13px}
.dh b{font-size:15px;white-space:nowrap}
.dh .sm{color:var(--mute);font-size:12px;line-height:1.15}
.dacts{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 6px;scroll-snap-type:x proximity}
.ac{flex:0 0 96px;scroll-snap-align:start;display:flex;flex-direction:column;align-items:center;gap:1px;border:3px solid var(--ink);border-radius:10px;background:#fff;color:var(--ink);font:inherit;padding:6px 4px;min-height:92px;cursor:pointer;box-shadow:0 4px 0 var(--ink)}
.ac:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.ac .ic{font-size:24px;line-height:1.1}
.ac .nm{font-weight:800;font-size:12px;line-height:1.1;text-align:center;min-height:26px;display:flex;align-items:center}
.ac .mt{font-size:10px;color:var(--mute);text-align:center;line-height:1.1}
.ac.sleep{background:#e3f8f5}
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:520px;z-index:30;max-height:52vh;display:flex;flex-direction:column;background:var(--paper);border:3px solid var(--ink);border-bottom:0;border-radius:20px 20px 0 0;box-shadow:0 -8px 22px rgba(43,32,54,.30);padding:0 10px calc(8px + env(safe-area-inset-bottom))}
.sheet.off{display:none}
.sheet.in{animation:shup .22s ease-out}
@keyframes shup{from{transform:translate(-50%,60%);opacity:.4}to{transform:translate(-50%,0);opacity:1}}
.sheet .grab{padding:7px 0 3px;display:flex;justify-content:center}
.sheet .grab i{width:44px;height:5px;border-radius:3px;background:#cdbfa8}
.sheet .sh{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.sheet .sh b{font-size:17px}
.sheet .sh .sm{font-size:12px;color:var(--mute)}
.slist{display:flex;flex-direction:column;gap:7px;overflow-y:auto;padding:2px 2px 8px;-webkit-overflow-scrolling:touch}
.ar{flex:0 0 auto;display:grid;grid-template-columns:34px 1fr;grid-template-rows:auto auto;column-gap:10px;align-items:center;text-align:left;border:3px solid var(--ink);border-radius:12px;background:#fff;color:var(--ink);font:inherit;padding:7px 10px;min-height:54px;cursor:pointer;box-shadow:0 4px 0 var(--ink)}
.ar:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.ar .ic{grid-row:1/3;font-size:26px;text-align:center}
.ar .nm{font-weight:800;font-size:14px;line-height:1.15}
.ar .mt{font-size:11px;color:var(--mute);line-height:1.2}
.ar.sleep{background:#e3f8f5}
.ar[disabled]{opacity:.45;pointer-events:none}
.ac[disabled]{opacity:.45;pointer-events:none}
.dtext{font-size:13px;line-height:1.35}
html[data-busy] .dock .dacts,html[data-busy] .dock .ib{opacity:.5;pointer-events:none}
.overlay{position:fixed;inset:0;background:rgba(43,32,54,.7);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;pointer-events:auto}
.overlay .card{max-width:420px;width:100%;max-height:85vh;overflow:auto}
.qrow{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:4px 0}
.feed div{padding:4px 0;border-bottom:2px dotted #e2d3a6;font-size:14px}
.feed div:last-child{border:0}
/* labels on map */
.bl{position:absolute;left:0;top:0;text-align:center;font-weight:800;font-size:11px;color:#fff;text-shadow:1px 1px 0 var(--ink),-1px 1px 0 var(--ink),1px -1px 0 var(--ink),-1px -1px 0 var(--ink);line-height:1.05;white-space:nowrap;will-change:transform}
.bl i{display:block;font-style:normal;font-size:15px;width:26px;height:26px;line-height:23px;margin:0 auto -5px;background:#fffdf5;border:2px solid var(--ink);border-radius:50%;position:relative;z-index:1;text-shadow:none;box-shadow:0 2px 0 rgba(43,32,54,.35)}
.bl span{display:inline-block;background:#fffdf5;color:var(--ink);border:2px solid var(--ink);border-radius:9px;padding:2px 8px 1px;font-size:12px;line-height:1.2;text-shadow:none;box-shadow:0 2px 0 rgba(43,32,54,.35)}
.bl em{display:inline-block;font-style:normal;background:var(--sun);color:var(--ink);border:2px solid var(--ink);border-radius:8px;font-size:10px;padding:0 4px;margin-top:2px;text-shadow:none}
.pop{position:absolute;left:0;top:0;font-weight:800;font-size:15px;line-height:1.1;color:#fff;white-space:nowrap;text-shadow:2px 2px 0 var(--ink),-1px -1px 0 var(--ink),1px -1px 0 var(--ink),-1px 1px 0 var(--ink);will-change:transform,opacity}
#mgbar{position:relative;height:34px;border:3px solid var(--ink);border-radius:10px;background:#fff;overflow:hidden;margin-top:10px}
.mgz{position:absolute;left:38%;width:24%;top:0;bottom:0;background:#8ce99a;border-left:2px solid var(--ink);border-right:2px solid var(--ink)}
.mgz:after{content:'';position:absolute;left:35%;width:30%;top:0;bottom:0;background:#40c057}
#mgm{position:absolute;top:2px;bottom:2px;width:12px;border-radius:6px;background:var(--accent);border:2px solid var(--ink);animation:mgm .85s linear infinite alternate}
@keyframes mgm{from{left:0}to{left:calc(100% - 12px)}}
.hintb{flex:1;text-align:left;border:3px solid var(--ink);border-radius:10px;background:var(--sun);color:var(--ink);font:inherit;font-weight:800;font-size:14px;padding:6px 10px;box-shadow:0 3px 0 var(--ink);cursor:pointer;line-height:1.25}
.hintb:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.bl.hint{animation:glow 1s ease-in-out infinite alternate}
@keyframes glow{from{filter:drop-shadow(0 0 2px #ffd23f)}to{filter:drop-shadow(0 0 10px #ffd23f) drop-shadow(0 0 4px #fff)}}
#banner{position:fixed;left:50%;transform:translateX(-50%);max-width:480px;width:calc(100% - 24px);z-index:20;pointer-events:none;opacity:0;background:#fff7d6;border:3px solid var(--ink);border-radius:10px;padding:8px 12px;box-shadow:0 4px 0 var(--ink);font-size:14px;line-height:1.3}
#banner.show{animation:bn 4.6s forwards}
#banner.good{background:#dff8e4}#banner.bad{background:#ffe0db}
@keyframes bn{0%{opacity:0;margin-top:-10px}8%{opacity:1;margin-top:0}86%{opacity:1}100%{opacity:0}}
#day{position:fixed;left:50%;top:30%;transform:translate(-50%,-50%);z-index:25;pointer-events:none;opacity:0;text-align:center;font-family:'Mali','Sarabun',sans-serif;font-size:28px;line-height:1.3;color:#fff;text-shadow:3px 3px 0 var(--ink),-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink);width:90%}
#day small{font-size:15px;display:inline-block;background:#fff8e7;color:var(--ink);border:3px solid var(--ink);border-radius:10px;padding:2px 10px;text-shadow:none;margin-top:6px}
#day.show{animation:dsp 2.1s ease-out forwards}
@keyframes dsp{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}20%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-62%) scale(1)}}
.pop.coin{font-size:18px;text-shadow:none}
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:99;max-width:90%;text-align:center}
#toast.show{opacity:1}
.chips{display:flex;gap:6px;overflow-x:auto}
.sw{width:34px;height:34px;border:3px solid #2b2036;border-radius:8px;cursor:pointer;padding:0}
.sw.on{outline:3px solid #ff6b5a;outline-offset:1px}
.swrow{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:4px 0 8px}
.pl.dead{opacity:.55;text-decoration:line-through;background:#ddd}
.r2.crit{animation:crit .9s infinite}
@keyframes crit{0%,100%{box-shadow:none}50%{box-shadow:inset 0 0 0 3px #ff4d4d}}
.ptok{position:absolute;left:0;top:0;width:24px;height:24px;border-radius:50%;border:3px solid #fff;background:#fff8e7;box-shadow:0 0 0 2px #2b2036,0 3px 0 2px rgba(43,32,54,.35);will-change:transform;opacity:.92}
.ptok canvas{width:100%;height:100%;border-radius:50%;display:block}
.ptok b{display:none;position:absolute;left:50%;top:-15px;transform:translateX(-50%);font-size:10px;color:#fff;padding:1px 6px;border-radius:8px;border:2px solid #2b2036;white-space:nowrap;max-width:90px;overflow:hidden;text-overflow:ellipsis}
.ptok::after{content:'';position:absolute;left:50%;bottom:-9px;margin-left:-5px;border:5px solid transparent;border-top:7px solid #2b2036;border-bottom:0}
.ptok.cur{width:34px;height:34px;opacity:1;animation:tokb .7s ease-in-out infinite alternate;box-shadow:0 0 0 2px #2b2036,0 0 0 5px rgba(255,255,255,.75),0 4px 0 3px rgba(43,32,54,.35)}
.ptok.cur b{display:block}
@keyframes tokb{from{margin-top:0}to{margin-top:-7px}}
</style>
</head>
<body>
<canvas id="world"></canvas>
<div id="lbls"></div>
<div id="dim"></div>
<div id="app" class="page"></div>
<div id="banner"></div>
<div id="day"></div>
<div id="toast"></div>
<script>
/* ============================================================
   ตั้งค่า Firebase (เฉพาะโหมดออนไลน์) — ใส่ค่าจากโปรเจกต์ของคุณ
   ถ้าเว้นว่างไว้ โหมดบอท/ส่งเครื่องต่อกัน/ดูเมืองยังเล่นได้ปกติ
   ============================================================ */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDs7dfK0T27wPTmHnDB-8K_OJqhqNLx_PQ",
  authDomain: "low-budget-brawl.firebaseapp.com",
  databaseURL: "https://low-budget-brawl-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "low-budget-brawl",
  storageBucket: "low-budget-brawl.firebasestorage.app",
  messagingSenderId: "43420725668",
  appId: "1:43420725668:web:fc7fc6ed69026732891131"
};

//#ENGINE-START
/* ===================== ENGINE (ไม่แตะ DOM) ===================== */
const DAY_UNITS = 16, START_HOUR = 6, RENT_EVERY = 5;
const MAPW = 16, MAPH = 46, TS = 8;
const BLD = {
  home:  {x:2, y:3, w:5,h:3,f:'n',dx:4, ic:'🏠',n:'ห้องพัก',   c:'#ff6b5a'},
  seven: {x:8, y:3, w:6,h:3,f:'n',dx:11,ic:'🏪',n:'มินิมาร์ท', c:'#2ec4b6'},
  office:{x:2, y:7, w:5,h:3,f:'n',dx:4, ic:'🏢',n:'ที่ทำงาน',  c:'#5b8def'},
  jobs:  {x:8, y:7, w:6,h:3,f:'n',dx:11,ic:'📋',n:'จัดหางาน',  c:'#52b788'},
  school:{x:2, y:11,w:5,h:3,f:'s',dx:4, ic:'🎓',n:'มหาลัย',   c:'#f2c14e'},
  gym:   {x:8, y:11,w:6,h:3,f:'s',dx:11,ic:'🏋️',n:'ฟิตเนส',   c:'#ef476f'},
  food:  {x:2, y:18,w:5,h:3,f:'n',dx:4, ic:'🍗',n:'ไก่ทอด',   c:'#ff9f1c'},
  mall:  {x:8, y:18,w:6,h:3,f:'s',dx:11,ic:'🛍️',n:'ห้างฯ',    c:'#9b5de5'},
  arcade:{x:2, y:22,w:5,h:3,f:'s',dx:4, ic:'🕹️',n:'ร้านเกม',  c:'#f15bb5'},
  bank:  {x:8, y:22,w:6,h:3,f:'s',dx:12,ic:'🏦',n:'ธนาคาร',   c:'#00bbf9'},
  hosp:  {x:2, y:33,w:5,h:3,f:'n',dx:4, ic:'🏥',n:'โรงพยาบาล', c:'#f8f9fa'},
  temple:{x:8, y:33,w:6,h:3,f:'n',dx:11,ic:'🛕',n:'วัด',       c:'#e9b44c'},
  market:{x:2, y:37,w:5,h:3,f:'s',dx:4, ic:'🏮',n:'ตลาดนัด',   c:'#e76f51'},
  bar:   {x:8, y:37,w:6,h:3,f:'s',dx:11,ic:'🍻',n:'ร้านนั่งชิล', c:'#6d597a'},
  salon: {x:2, y:26,w:5,h:3,f:'n',dx:4, ic:'💈',n:'ร้านเสริมสวย', c:'#ff8fab'},
  cafe:  {x:8, y:26,w:6,h:3,f:'n',dx:11,ic:'☕',n:'คาเฟ่',      c:'#a0674b'},
  cinema:{x:2, y:41,w:5,h:3,f:'n',dx:4, ic:'🎬',n:'โรงหนัง',    c:'#3a506b'},
  petshop:{x:8,y:41,w:6,h:3,f:'n',dx:11,ic:'🐾',n:'ร้านสัตว์เลี้ยง',c:'#9ad94b'}
};
const PLACES = Object.keys(BLD).concat('plaza');
const placeName = k => k==='plaza' ? 'ลานกลางเมือง' : BLD[k].n;
const placeIc = k => k==='plaza' ? '🌳' : BLD[k].ic;
const LOC = {};
Object.keys(BLD).forEach(k=>{ const b=BLD[k]; LOC[k]={x:b.dx,y:b.f==='n'?b.y-1:b.y+b.h}; });
LOC.plaza = {x:7,y:29};
const STREETS = [2,6,10,14,17,21,25,32,36,40,44];
const GRID = (function(){
  const g=[]; for(let y=0;y<MAPH;y++) g.push(Array(MAPW).fill('#'));
  STREETS.forEach(y=>{ for(let x=1;x<=14;x++) g[y][x]='r'; });
  const col=(x,a,b,c)=>{ for(let y=a;y<=b;y++) g[y][x]=c||'r'; };
  // ซอยเชื่อมระหว่างถนน (เป็นเขาวงกตเล็กๆ ต้องเลือกทางเดิน)
  [[14,3,5],[1,3,5],[1,7,9],[14,7,9],[14,11,13],[1,11,13],[1,18,20],[14,18,20],[14,22,24],[1,22,24],[1,33,35],[14,33,35],[1,37,39],[14,37,39],[7,33,35],[7,37,39],[1,26,28],[14,26,28],[7,26,28],[1,41,43],[14,41,43],[7,41,43]].forEach(c=>col(c[0],c[1],c[2]));
  // ทางลัดตรงกลาง (ซอย) มีแค่ 2 แห่ง
  col(7,7,9); col(7,18,20);
  // แม่น้ำ + สะพาน 2 แห่ง
  for(let y=15;y<=16;y++) for(let x=1;x<=14;x++) g[y][x]='w';
  col(3,15,16,'b'); col(12,15,16,'b');
  // สวนสาธารณะ + บ่อน้ำ
  for(let y=29;y<=31;y++) for(let x=1;x<=14;x++) g[y][x]='p';

function advise(S,p){

  const go=(k,why,act)=>p.loc===k?{msg:why+' → '+(act?act.n:''),loc:k,act:act&&act.a}:{msg:why+' → ไป'+placeName(k)+' ('+tt(k)+' ชม.)',loc:k,act:null};
  const eatK=(tt('seven')<=tt('food')||p.money<130)?'seven':'food';
  if(!p.ate && p.money>=50 && p.time-tt(eatK)-1>=hm(eatK)) return go(eatK,'ยังไม่ได้กินข้าว!',{n:'กินข้าว',a:{t:'do',id:eatK==='food'?'meal1':'snack'}});

    const cc=p.role==='nurse'?250:500;

    return p.loc==='home'?{msg:'⚠️ สุขภาพต่ำมาก พักผ่อนเดี๋ยวนี้ → เข้านอน',loc:'home',act:{t:'do',id:'sleep'}}:go('home','⚠️ สุขภาพต่ำมาก กลับไปนอนพัก',null);
  }
  if((p.coll||0)>=2&&p.money>=1200&&p.time>=tt('hosp')+4+hm('hosp')) return go('hosp','ใบเตือน '+p.coll+'/3 อันตราย!',{n:'พักฟื้น',a:{t:'do',id:'rehab'}});
  if(p.pet&&!p.pet.fed&&p.money>=PETS[p.pet.k].feed&&p.time-hm(p.loc)>=2) return go('home',PETS[p.pet.k].n+'หิว',{n:'ให้อาหาร',a:{t:'do',id:'feedpet'}});
  if(p.owe>0 && p.money>=p.owe) return go('home','ถึงรอบจ่ายค่าเช่า',{n:'จ่ายค่าเช่า',a:{t:'do',id:'rent'}});
  if(p.hygiene<35) return go('home','ตัวเหม็นแล้ว',{n:'อาบน้ำ',a:{t:'do',id:'shower'}});
  if(p.stress>=70) return go('plaza','เครียดสูง พักหน่อย',{n:'นั่งพักในสวน',a:{t:'do',id:'rest'}});
  if(p.job===0) return go('jobs','ยังไม่มีงาน',{n:'สมัครงานแรก',a:{t:'do',id:'apply',arg:1}});
  if(p.job>=3&&!p.path) return go('jobs','ถึงเวลาเลือกสายงาน!',{n:'เลือกสายงาน',a:{t:'do',id:'path',arg:eduLv(p)>=2?'mgr':'biz'}});
  let best=p.job; for(let i=6;i>p.job;i--){ if(i>=4&&!p.path) continue; const j=jobAt(i,p.path); if(p.exp>=j.exp-(p.role==='sales'?2:0)&&eduLv(p)>=j.edu&&!slotFull(S,p,i)){ best=i; break; } }
  if(best!==p.job) return go('jobs','ได้เลื่อนขั้นแล้ว!',{n:'สมัคร '+jobAt(best,p.path).n,a:{t:'do',id:'apply',arg:best}});
  if(p.time<=hm(p.loc)+1 && p.loc!=='home') return go('home','ใกล้หมดวัน กลับไปนอน',null);
  if(p.time<=2 && p.loc==='home') return {msg:'พอแล้ววันนี้ → เข้านอน',loc:'home',act:{t:'do',id:'sleep'}};
  if(p.job>0){ const J=jobOf(p); if(p.stress<85 && p.time>=tt(J.at)+J.hr+hm(J.at)) return go(J.at,'ไปหาเงิน (ที่ทำงาน: '+placeName(J.at)+')',{n:'ทำงาน',a:{t:'do',id:'work'}}); }

}

function botMove(S){
  const p=S.players[S.cur];
  if(S.choice){
    if(S.choice.o){ const o=S.choice.o, it=ITEMS.find(x=>x.id===o.item); return {t:'choose',i:(it&&p.money>=o.price+1200&&o.price<=it.c*0.75&&rnd()<0.5)?0:1}; }
    const en=ENCOUNTERS[S.choice.i]; const bad=o=>((o.fx.m||0)<0&&p.money+(o.fx.m||0)<400)||((o.fx.tm||0)<0&&p.time+o.fx.tm<travelTime(p,p.loc,'home')+1); return {t:'choose',i:bad(en.a)?1:(bad(en.b)?0:(rnd()<.6?0:1))};
  }
  const tt=(k)=>travelTime(p,p.loc,k);
  const home=(k)=>travelTime(p,k,'home');
  const safe=(k,t)=>p.time-tt(k)-t>=home(k);
  const at=(k,id,arg)=>p.loc===k?{t:'do',id:id,arg:arg}:{t:'go',loc:k,m:(tt(k)>=3&&p.money>=2500&&trip(S,p,p.loc,k,'win').t<tt(k))?'win':((tt(k)>=2&&p.money>=600&&trip(S,p,p.loc,k,'bus').t<tt(k))?'bus':undefined)};
  if(!p.ate){
    const k=p.money>=130?'food':'seven';
    if(p.money>=50 && safe(k,1)) return at(k,k==='food'?'meal1':'snack');
  }
  if(p.health<32){
    if(p.money>=(p.role==='nurse'?250:500)&&safe('plaza',3)) return at('plaza','clinic');
    return p.loc==='home'?{t:'do',id:'sleep'}:{t:'go',loc:'home'};
  }
  if(!p.ate&&p.money<50&&safe('temple',1)) return at('temple','alms');
  if((p.coll||0)>=2&&p.money>=2500&&safe('hosp',4)) return at('hosp','rehab');
  if(p.pet&&!p.pet.fed&&p.money>=PETS[p.pet.k].feed+100&&safe('home',1)) return at('home','feedpet');
  if(p.owe>0 && p.money>=p.owe && safe('home',1)) return at('home','rent');
  if(p.debt>0 && p.money>p.debt+1200 && safe('bank',1)) return at('bank','repay');
  if(p.hygiene<35 && safe('home',1)) return at('home','shower');
  if(p.stress>=75 && safe('home',2)) return at('home','tv');
  if(p.job>=3&&!p.path&&safe('jobs',1)) return at('jobs','path',eduLv(p)>=2?(rnd()<0.7?'mgr':'spec'):'biz');
  // งาน
  let best=p.job;
  for(let i=6;i>p.job;i--){ if(i>=4&&!p.path) continue; const j=jobAt(i,p.path); if(p.exp>=j.exp&&eduLv(p)>=j.edu&&!slotFull(S,p,i)){ best=i; break; } }
  if(best!==p.job && safe('jobs',1)) return at('jobs','apply',best);
  if(p.job===0 && safe('jobs',1)) return at('jobs','apply',1);
  const nxt=p.job<6?jobAt(p.job+1,p.path):null;
  if(nxt && nxt.edu>eduLv(p) && p.money>=800 && p.stress<65 && safe('school',4) && rnd()<0.5) return at('school','study');
  if(p.mean && rnd()<0.15 && safe('plaza',1)){
    const o=S.players.filter(x=>x.id!==p.id&&!x.dead&&x.money>=1500);
    if(o.length) return at('plaza','borrow',pick(o).id);
  }
  if(p.mean&&p.pranks.length&&rnd()<0.3&&safe('plaza',1)){
    const o=S.players.filter(x=>x.id!==p.id&&!x.dead);
    if(o.length) return at('plaza','prank',pick(o).id+'_'+pick(p.pranks));
  }
  if(p.mean&&p.pranks.length<2&&p.money>=1500&&rnd()<0.08&&safe('seven',1)) return at('seven','buyprank',pick(Object.keys(PRANKS)));
  const J=jobOf(p), jl=J?J.at:'office', jh=J?J.hr:1;
  if(p.job>0&&(p.idle||0)>=2&&p.health>=28&&p.stress<92&&safe(jl,jh)) return at(jl,'work');
  const rg=ROLEGIG[p.role];
  if(rg && (p.gigs||0)<2 && p.stress<78 && safe(rg[0],rg[1]) && (p.loc===rg[0]||p.job===0||p.role==='dev'||rnd()<0.25)) return at(rg[0],'gig');
  if(p.rel.friend<40&&p.seen.friend!==S.round&&p.money>=700&&safe('food',2)&&rnd()<0.35) return at('food','friendmeal');
  if(p.job>0&&p.loc===jl&&!p.perk&&safe(jl,1+jh)&&(J.perk!=='lib'||p.stress<70)) return {t:'do',id:'perk'};
  if(p.job>0 && p.stress<85 && p.health>=28 && safe(jl,jh)) return at(jl,'work');
  if(p.money>=4000 && rnd()<0.5 && safe('mall',1)){
    const want=ITEMS.filter(i=>!hasI(p,i.id)&&p.money>=i.c+1500&&!(i.f&&furnN(p)>=ROOMCAP[p.hs||0]));
    if(want.length) return at('mall','buy',pick(want).id);
  }
  if(!p.pet&&p.money>=3500&&rnd()<0.25&&safe('petshop',1)) return at('petshop','adopt','cat');
  if(p.rel.love<85&&p.seen.love!==S.round&&p.money>=2500&&p.happy<70&&safe('mall',3)&&rnd()<0.2) return at('mall','date');
  if(p.stress>=55&&p.happy<65&&p.money>=2500&&rnd()<0.15){ const o=pick([['cafe','coffee',1],['salon','massage',2],['cinema','matinee',3],['cinema','movie',3]]); if(safe(o[0],o[2])) return at(o[0],o[1]); }
  if((p.hs||0)===0&&p.money>=HOUSES[1].up+4000&&rnd()<0.4&&safe('home',3)) return at('home','move1');
  if((p.hs||0)<2&&p.money>=HOUSES[2].up+4500&&rnd()<0.4&&safe('bank',2)) return at('bank','buyhouse');
  if(p.stress>=60&&rnd()<0.3&&safe('temple',2)) return at('temple','medit');
  if(p.job===0&&p.stl!==S.round&&rnd()<0.3&&safe('market',3)) return at('market','stall');
  if(p.happy<45&&p.money>=900&&rnd()<0.3&&safe('bar',2)) return at('bar','karaoke');
  if(p.happy<35 && p.money>=200 && safe('arcade',2)) return at('arcade','play');
  if(p.loc!=='home') return {t:'go',loc:'home'};
  if(p.seen.fam!==S.round&&p.time>=1&&p.rel.fam<80) return {t:'do',id:'call'};
  return {t:'do',id:'sleep'};
}

function hit3D(e){
  if(!R3.on) return;
  const X=R3, el=X.r.domElement, r=el.getBoundingClientRect();
  const nx=((e.clientX-r.left)/r.width)*2-1, ny=-((e.clientY-r.top)/r.height)*2+1;
  X.ray.setFromCamera({x:nx,y:ny},X.cam);
  let hit=null;
  const hb=X.ray.intersectObjects(X.bld,false); if(hb.length) hit=hb[0].object.userData.k;
  if(!hit){
    const pt=new X.T.Vector3();
    if(X.ray.ray.intersectPlane(X.plane,pt)){
      Object.keys(BLD).forEach(k=>{ const L=LOC[k]; if(pt.x>=L.x&&pt.x<L.x+1&&pt.z>=L.y&&pt.z<L.y+1) hit=k; });
      if(!hit && pt.z>=26 && pt.z<=32 && pt.x>=1 && pt.x<=MAPW-1) hit='plaza';
    }
  }
  tapPlace(hit);
}

  init(){ if(this.ctx){ if(this.ctx.state==='suspended') this.ctx.resume(); return; } try{ this.ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(_){} },
  tone(f,d,type,v,delay,slide){ if(!this.on||!this.ctx) return; const c=this.ctx,t=c.currentTime+(delay||0),o=c.createOscillator(),g=c.createGain();

    g.gain.setValueAtTime(v||.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+d); o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+d+.03); },
  play(n){ if(!this.on||!this.ctx||G.demo) return;
    switch(n){

function canAct(){
  const S=G.S; if(!S||S.phase!=='play'||G.demo) return false;
  const p=S.players[S.cur]; if(p.bot) return false;
  if(G.online) return p.uid===G.online.uid;
  return true;
}
function submit(a,fromBot){
  if(G.demo && !fromBot) return;
  if(G.busy && !fromBot) return;
  if(G.online && !G.online.host){
    if(!canAct()) return;
    G.online.fb.push(G.online.fb.ref(G.online.fb.db,'dcd/rooms/'+G.online.code+'/actions'),{uid:G.online.uid,a:a});
    return;
  }
  if(!fromBot && !canAct()) return;
  const r=apply(G.S,a);
  if(r.err){
    if(fromBot){ commit(apply(G.S,{t:'end'}).S); } else toast(r.err);
    return;
  }
  commit(r.S);
}
function commit(S){
  setState(S);
  if(G.online && G.online.host){
    G.online.fb.set(G.online.fb.ref(G.online.fb.db,'dcd/rooms/'+G.online.code+'/state'),JSON.stringify(S));
  }
  render(); schedule();
}
function schedule(){
  clearTimeout(botTimer);
  const S=G.S; if(!S) return;
  if(S.phase!=='play'){ if(G.demo) botTimer=setTimeout(()=>{ startDemo(); render(); },4000); return; }
  if(G.online && !G.online.host) return;
  if(!S.players[S.cur].bot) return;
  botTimer=setTimeout(function step(){
    if(!G.S||G.S.phase!=='play') return;
    if(!G.demo&&G.S.report&&G.S.report.no!==G.repAck){ botTimer=setTimeout(step,300); return; }
    if(G.busy){ botTimer=setTimeout(step,120); return; }
    submit(botMove(G.S),true);
  },650/G.speed);
}

async function fbInit(){

}

function listenRoom(){

  fb.onValue(fb.ref(fb.db,base+'/lobby'),s=>{ o.lobby=s.val()||{}; if(G.screen==='lobby') render(); });
  fb.onValue(fb.ref(fb.db,base+'/cfg'),s=>{ if(s.val()){ o.cfg=s.val(); if(G.screen==='lobby') render(); } });
  fb.onValue(fb.ref(fb.db,base+'/state'),s=>{
    const v=s.val(); if(!v||o.host) return;
    if(G.screen!=='game'){ stopGameForReal(); G.speed=1; }
    setState(JSON.parse(v)); G.screen='game'; render();
  });
  if(o.host){
    fb.onChildAdded(fb.ref(fb.db,base+'/actions'),s=>{
      const m=s.val(); fb.remove(s.ref);
      if(!m||!G.S||G.S.phase!=='play') return;
      const p=G.S.players[G.S.cur];
      if(p.bot||p.uid!==m.uid) return;
      const r=apply(G.S,m.a); if(!r.err) commit(r.S);
    });
  }
}

  switch(k){
    case 'diff': G.diff=rid; render(); break;
    case 'sfx': SFX.on=!SFX.on; try{localStorage.setItem('mc_sfx',SFX.on?'1':'0');}catch(_){} render(); break;

      if(ad.act) submit(ad.act); else if(ad.loc!==p.loc) submit({t:'go',loc:ad.loc}); else toast('ลองดูกิจกรรมที่แถบล่างได้เลย'); break; }

      if(bar&&mk){ const b=bar.getBoundingClientRect(), r=mk.getBoundingClientRect(); const pos=((r.left+r.width/2)-b.left)/b.width; q=Math.max(0,Math.min(1,1-Math.abs(pos-0.5)*2.6)); }

    case 'hot': newSlots('hot'); go('setup'); break;
    case 'onl': go('online'); break;

      stopGameForReal(); G.online=null; G.panel=null; G.howto=false; startDemo(); go('menu'); break;

    case 'how': G.howto=true; G.panel=null; render(); break;
    case 'role': G.pick=i; render(); break;
    case 'closerole': G.pick=null; render(); break;
    case 'setrole': G.slots[i].role=rid||null; G.pick=null; if(G.screen==='lobby') pushMyLobby(); render(); break;
    case 'howx': G.howto=false; render(); break;
    case 'quests': G.panel='quests'; render(); break;
    case 'log': G.panel='log'; render(); break;
    case 'closepanel': G.panel=null; render(); break;
    case 'speed': { const seq=G.screen==='watch'?[1,2,4]:[1,2,3]; const cur=G.speed===1.6?1:G.speed; G.speed=seq[(seq.indexOf(cur)+1)%seq.length]; render(); break; }
    case 'tog': G.slots[i]=G.slots[i].bot?humanDef(i,'ผู้เล่น '+(i+1)):botDef(i); render(); break;
    case 'del': if(G.slots.length>2){ G.slots.splice(i,1); render(); } else toast('ต้องมีอย่างน้อย 2 คน'); break;
    case 'add': if(G.slots.length<6){ G.slots.push(G.hot?humanDef(G.slots.length):botDef(G.slots.length)); render(); } break;
    case 'startlocal': startLocal(); break;
    case 'ack': G.ack=G.S.turnNo; render(); break;
    case 'repack': if(G.S&&G.S.report) G.repAck=G.S.report.no; render(); schedule(); break;
    case 'ride': G.ride=d.dataset.v; render(); break;
    case 'room': G.panel='room'; render(); break;
    case 'sheet': G.sheet=!G.sheet; G.sheetAnim=!!G.sheet; render(); break;
    case 'sheetx': G.sheet=false; render(); break;
    case 'cardack': if(G.S&&G.S.card) G.cardAck=G.S.card.no; render(); break;
    case 'deathack': if(G.S&&G.S.lastDeath) G.deathAck=G.S.lastDeath.no; render(); break;
    case 'look': G.lookPick=i; render(); break;
    case 'lookx': G.lookPick=null; render(); break;
    case 'lk': { const s=G.slots[G.lookPick]; if(s){ s.look[d.dataset.k]=+d.dataset.v; saveLook(G.lookPick); if(G.screen==='lobby') pushMyLobby(); render(); } break; }
    case 'lkr': { const s=G.slots[G.lookPick]; if(s){ const r=n=>Math.floor(Math.random()*n); s.look={hair:r(4),hc:r(6),shirt:r(8),skin:r(4)}; saveLook(G.lookPick); if(G.screen==='lobby') pushMyLobby(); render(); } break; }
    case 'again': if(G.online){ stopGameForReal(); G.online=null; startDemo(); go('menu'); } else startLocal(); break;
    case 'ocreate': onlineCreate(); break;
    case 'ojoin': onlineJoin(); break;
    case 'obot+': onlineSetBots(1); break;
    case 'obot-': onlineSetBots(-1); break;
    case 'ostart': onlineStart(); break;
  }
});
document.addEventListener('click',e=>{ const ae=document.activeElement; if(ae&&ae.tagName==='INPUT'&&e.target!==ae) ae.blur(); },true);
document.addEventListener('input',e=>{ const n=e.target.dataset.name; if(n!==undefined && G.slots[n]) G.slots[n].name=e.target.value; });
document.addEventListener('change',e=>{
  if(e.target.matches('[data-months]')) G.months=+e.target.value;
  if(e.target.matches('[data-omonths]')) onlineSetMonths(e.target.value);
});
startDemo(); render();
// ใช้ภาพแบนเป็นหลัก (ไม่โหลด three.js แล้ว)
</script>
</body>
</html>
